---
name: release-please

# Maintains a release PR from conventional commits; merging it bumps
# .claude-plugin/plugin.json, updates the changelog, and tags vX.Y.Z.
# The felddy/claude-plugins marketplace pins installs to those tags.

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
