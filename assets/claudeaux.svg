<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Claudeaux: a gold fleur-de-lis with a spark, on bayou green">
  <!-- Original design: a fleur-de-lis crowned by an eight-ray spark.
       Not derived from any Anthropic logomark. -->
  <defs>
    <radialGradient id="bayou" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2a5540"/>
      <stop offset="100%" stop-color="#16301f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bayou)"/>
  <g fill="#d9a62e">
    <!-- spark: eight rays above the crown -->
    <g transform="translate(256 118)">
      <path d="M0 -44 L8 -10 L0 -2 L-8 -10 Z"/>
      <path d="M0 44 L8 10 L0 2 L-8 10 Z"/>
      <path d="M-44 0 L-10 -8 L-2 0 L-10 8 Z"/>
      <path d="M44 0 L10 -8 L2 0 L10 8 Z"/>
      <g transform="rotate(45)">
        <path d="M0 -36 L6 -9 L0 -2 L-6 -9 Z"/>
        <path d="M0 36 L6 9 L0 2 L-6 9 Z"/>
        <path d="M-36 0 L-9 -6 L-2 0 L-9 6 Z"/>
        <path d="M36 0 L9 -6 L2 0 L9 6 Z"/>
      </g>
    </g>
    <!-- central petal -->
    <path d="M256 160
             C 234 212 222 252 222 292
             C 222 320 236 342 256 352
             C 276 342 290 320 290 292
             C 290 252 278 212 256 160 Z"/>
    <!-- side scrolls, mirrored -->
    <path d="M208 344
             C 162 338 128 306 128 262
             C 128 232 146 212 170 212
             C 190 212 204 226 204 244
             C 204 258 194 268 182 268
             C 190 282 204 290 220 292
             C 216 312 212 330 208 344 Z"/>
    <path d="M304 344
             C 350 338 384 306 384 262
             C 384 232 366 212 342 212
             C 322 212 308 226 308 244
             C 308 258 318 268 330 268
             C 322 282 308 290 292 292
             C 296 312 300 330 304 344 Z"/>
    <!-- band -->
    <rect x="196" y="356" width="120" height="26" rx="13"/>
    <!-- tails below the band -->
    <path d="M232 392 C 232 416 244 432 256 440 C 268 432 280 416 280 392 Z"/>
    <path d="M198 390 C 192 410 178 422 164 426 C 172 406 176 396 178 388 Z"/>
    <path d="M314 390 C 320 410 334 422 348 426 C 340 406 336 396 334 388 Z"/>
  </g>
</svg>
